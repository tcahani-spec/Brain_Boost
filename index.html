<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brain Boost</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #fdfaf6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
            width: 100%;
        }
        #app-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            box-sizing: border-box;
            background: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body class="antialiased">
    <div id="app-container">
        <header class="flex justify-between items-center border-b-2 border-yellow-200 pb-3 mb-4">
            <button onclick="location.reload()" class="text-xl">🏠</button>
            <h1 class="text-xl font-bold text-gray-800">Brain Boost</h1>
            <button onclick="document.getElementById('settings').classList.toggle('hidden')" class="text-xl">⚙️</button>
        </header>

        <div id="settings" class="hidden bg-orange-50 p-4 rounded-lg mb-4">
            <input type="password" id="api-key" placeholder="Enter Gemini API Key" class="w-full p-2 border rounded mb-2">
            <button onclick="saveKey()" class="w-full bg-yellow-500 text-white p-2 rounded">Save Key</button>
        </div>

        <div class="flex gap-2 mb-6">
            <button id="btn-william" onclick="setPlayer('William')" class="flex-1 p-3 rounded-lg border-2 border-yellow-400 bg-yellow-400 text-white font-bold">William</button>
            <button id="btn-evan" onclick="setPlayer('Evan')" class="flex-1 p-3 rounded-lg border-2 border-yellow-400 bg-white text-yellow-500 font-bold">Evan</button>
        </div>

        <main id="game-ui">
            <div id="question-box" class="bg-yellow-50 border-2 border-yellow-200 p-6 rounded-2xl text-center mb-6">
                <p id="question-text" class="text-lg font-medium text-gray-700">Press Start to begin!</p>
            </div>
            
            <button id="start-btn" onclick="startQuiz()" class="w-full bg-yellow-500 text-white p-4 rounded-xl font-bold text-lg shadow-lg">Start Dash</button>
            
            <div id="answers" class="hidden flex flex-col gap-3">
                <button onclick="check(0)" id="a0" class="w-full p-4 border-2 border-yellow-400 rounded-xl hover:bg-yellow-50 transition"></button>
                <button onclick="check(1)" id="a1" class="w-full p-4 border-2 border-yellow-400 rounded-xl hover:bg-yellow-50 transition"></button>
                <button onclick="check(2)" id="a2" class="w-full p-4 border-2 border-yellow-400 rounded-xl hover:bg-yellow-50 transition"></button>
                <button onclick="check(3)" id="a3" class="w-full p-4 border-2 border-yellow-400 rounded-xl hover:bg-yellow-50 transition"></button>
            </div>
        </main>
    </div>

    <script>
        let currentPlayer = 'William', score = 0, qCount = 0, currentQ = null;

        function saveKey() {
            localStorage.setItem('geminiKey', document.getElementById('api-key').value);
            alert('Key Saved!');
        }

        function setPlayer(p) {
            currentPlayer = p;
            document.getElementById('btn-william').className = p === 'William' ? 'flex-1 p-3 rounded-lg border-2 border-yellow-400 bg-yellow-400 text-white font-bold' : 'flex-1 p-3 rounded-lg border-2 border-yellow-400 bg-white text-yellow-500 font-bold';
            document.getElementById('btn-evan').className = p === 'Evan' ? 'flex-1 p-3 rounded-lg border-2 border-yellow-400 bg-yellow-400 text-white font-bold' : 'flex-1 p-3 rounded-lg border-2 border-yellow-400 bg-white text-yellow-500 font-bold';
        }

        async function startQuiz() {
            document.getElementById('start-btn').classList.add('hidden');
            document.getElementById('answers').classList.remove('hidden');
            nextQuestion();
        }

        async function nextQuestion() {
            if (qCount >= 5) {
                document.getElementById('question-text').innerText = `Final Score: ${score}/5`;
                document.getElementById('answers').classList.add('hidden');
                return;
            }
            qCount++;
            document.getElementById('question-text').innerText = "Generating...";
            
            const key = localStorage.getItem('geminiKey');
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: "Generate a 4th grade multiple choice question in JSON: {'q': '...', 'options': ['A', 'B', 'C', 'D'], 'correctIndex': 0}" }] }] })
                });
                const data = await res.json();
                const json = JSON.parse(data.candidates[0].content.parts[0].text.replace(/```json|```/g, ""));
                currentQ = json;
                document.getElementById('question-text').innerText = currentQ.q;
                currentQ.options.forEach((opt, i) => document.getElementById('a'+i).innerText = opt);
            } catch (e) {
                document.getElementById('question-text').innerText = "Error: Check your API Key.";
            }
        }

        function check(idx) {
            if (idx === currentQ.correctIndex) score++;
            nextQuestion();
        }
    </script>
</body>
</html>

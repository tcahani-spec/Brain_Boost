<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drop-Off Brain Boost</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #fdfaf6; margin: 0; padding: 0; display: flex; justify-content: center; }
        #app-container { width: 100%; max-width: 400px; padding: 20px; background: white; min-height: 100vh; box-sizing: border-box; box-shadow: 0 0 10px rgba(0,0,0,0.1); position: relative; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #fce4b3; padding-bottom: 15px; margin-bottom: 20px; }
        .reset-btn { cursor: pointer; font-size: 1.2rem; }
        .stats { font-size: 1rem; font-weight: bold; color: #d97706; }
        .profile-toggle { display: flex; gap: 8px; margin-bottom: 25px; }
        .profile-toggle button { flex: 1; padding: 12px 5px; border: 2px solid #fcd34d; border-radius: 8px; background-color: #fef3c7; font-size: 0.95rem; color: #92400e; cursor: pointer; }
        #btn-william.active { background-color: #f59e0b; color: white; border-color: #b45309; }
        #btn-evan.active { background-color: #d97706; color: white; border-color: #92400e; }
        #btn-coop.active { background-color: #b45309; color: white; border-color: #78350f; }
        #question-container { background: #fffbeb; border-radius: 12px; padding: 25px 15px; text-align: center; margin-bottom: 20px; border: 2px solid #fcd34d; min-height: 90px; }
        .answer-btn { display: block; width: 100%; padding: 18px; margin-bottom: 12px; border: 2px solid #fbbf24; border-radius: 10px; background: white; font-size: 1.1rem; cursor: pointer; }
        .answer-btn:active { background: #fef3c7; }
        .hidden { display: none !important; }
        #confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }
    </style>
</head>
<body>
    <canvas id="confetti-canvas"></canvas>
    <div id="app-container">
        <header>
            <span class="reset-btn" onclick="resetApp()">🏠</span>
            <h1>Brain Boost</h1>
            <span class="reset-btn" onclick="toggleSettings()">⚙️</span>
        </header>
        <div id="settings-modal" class="hidden" style="background:#fff3e0; padding:10px; margin-bottom:20px; border-radius:8px;">
            <input type="password" id="api-key-input" placeholder="Paste Gemini API Key" style="width:100%; padding:8px;">
            <button onclick="saveApiKey()" style="width:100%; margin-top:5px;">Save Key</button>
        </div>
        <div class="profile-toggle">
            <button id="btn-william" class="active" onclick="switchProfile('William')">William</button>
            <button id="btn-evan" onclick="switchProfile('Evan')">Evan</button>
            <button id="btn-coop" onclick="switchProfile('Team')">Team</button>
        </div>
        <main>
            <div id="current-player-display" style="text-align:center; font-weight:bold; margin-bottom:15px; color:#d97706;">William's Turn!</div>
            <div id="question-container"><p id="question-text">Press Start to begin!</p></div>
            <button id="start-btn" class="answer-btn" onclick="startGame()">Start 5-Question Dash!</button>
            <div id="answers-container" class="hidden">
                <button class="answer-btn" onclick="checkAnswer(0, event)" id="ans-0"></button>
                <button class="answer-btn" onclick="checkAnswer(1, event)" id="ans-1"></button>
                <button class="answer-btn" onclick="checkAnswer(2, event)" id="ans-2"></button>
                <button class="answer-btn" onclick="checkAnswer(3, event)" id="ans-3"></button>
            </div>
        </main>
    </div>
    <script>
        let currentPlayer = 'William', score = 0, qNum = 0, isPlaying = false;
        let queue = { William: [], Evan: [], Team: [] };
        
        function saveApiKey() { localStorage.setItem('geminiApiKey', document.getElementById('api-key-input').value); alert("Key Saved!"); }
        function toggleSettings() { document.getElementById('settings-modal').classList.toggle('hidden'); }
        function resetApp() { isPlaying = false; score = 0; qNum = 0; location.reload(); }
        
        function switchProfile(p) {
            currentPlayer = p;
            document.querySelectorAll('.profile-toggle button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-'+p.toLowerCase()).classList.add('active');
            document.getElementById('current-player-display').innerText = p + "'s Turn!";
        }

        async function startGame() {
            isPlaying = true;
            document.getElementById('start-btn').classList.add('hidden');
            document.getElementById('answers-container').classList.remove('hidden');
            loadNext();
        }

        async function loadNext() {
            if (qNum >= 5) { endGame(); return; }
            qNum++;
            document.getElementById('question-text').innerText = "Loading...";
            
            // Logic: Try AI, fallback to procedural
            let q = await getQuestion(currentPlayer);
            currentQ = q;
            document.getElementById('question-text').innerText = q.q;
            q.options.forEach((o, i) => document.getElementById('ans-'+i).innerText = o);
        }

        async function getQuestion(p) {
            // Simplified fallback for demonstration
            return { q: "Math: What is 5+5?", options: ["10", "11", "9", "8"], correctIndex: 0 };
        }

        function checkAnswer(idx, e) {
            if (idx === currentQ.correctIndex) { score++; }
            loadNext();
        }

        function endGame() {
            isPlaying = false;
            document.getElementById('question-text').innerText = "Score: " + score;
            document.getElementById('start-btn').classList.remove('hidden');
            document.getElementById('answers-container').classList.add('hidden');
        }
    </script>
</body>
</html>

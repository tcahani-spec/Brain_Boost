<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Drop-off Trivia Dash</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      --card-bg: #ffffff;
      --primary: #4318ff;
      --william-color: #00b5d8;
      --evan-color: #805ad5;
      --text-dark: #1b2559;
      --correct: #05cd99;
      --incorrect: #ee5d50;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    
    body {
      background: var(--bg-gradient);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0px 20px 40px rgba(0, 0, 0, 0.08);
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 2px solid #edf2f7;
    }

    .home-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: #f4f7fe;
      border: 1px solid #e0e5f2;
      border-radius: 12px;
      color: var(--text-dark);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .status-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 20px;
      background: #edf2f7;
      color: #4a5568;
    }

    .view { display: none; flex-direction: column; gap: 15px; }
    .view.active { display: flex; }

    .welcome-header { text-align: center; margin-top: 10px; }
    .welcome-header h1 { font-size: 1.6rem; color: var(--text-dark); margin-bottom: 6px; }
    .welcome-header p { font-size: 0.95rem; color: #707ebe; }

    .profile-cards { display: flex; flex-direction: column; gap: 12px; margin: 10px 0; }
    .profile-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      border-radius: 18px;
      border: 2px solid #e0e5f2;
      background: #f8fafc;
      cursor: pointer;
    }

    .profile-card[data-profile="william"] { border-left: 8px solid var(--william-color); }
    .profile-card[data-profile="evan"] { border-left: 8px solid var(--evan-color); }

    .start-badge { padding: 8px 16px; border-radius: 10px; font-weight: bold; font-size: 0.85rem; color: white; }
    .bg-william { background: var(--william-color); }
    .bg-evan { background: var(--evan-color); }

    .progress-bar-container { height: 8px; width: 100%; background: #e0e5f2; border-radius: 4px; overflow: hidden; }
    .progress-bar { height: 100%; width: 0%; background: var(--primary); transition: width 0.3s ease; }

    .question-text { font-size: 1.2rem; font-weight: 700; color: var(--text-dark); min-height: 60px; line-height: 1.4; }
    .options-grid { display: flex; flex-direction: column; gap: 10px; }
    .option-btn {
      padding: 16px;
      border: 2px solid #e0e5f2;
      border-radius: 14px;
      background: #f8fafc;
      font-size: 1rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }

    .option-btn.correct { background: var(--correct) !important; color: white; border-color: var(--correct); }
    .option-btn.incorrect { background: var(--incorrect) !important; color: white; border-color: var(--incorrect); }

    .api-config { display: flex; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #e0e5f2; }
    .api-config input { flex: 1; padding: 8px 12px; border: 1px solid #e0e5f2; border-radius: 8px; font-size: 0.8rem; }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <div class="app-container">
    <div class="navbar">
      <button class="home-btn" onclick="goHome()">🏠 Home</button>
      <span id="badge" class="status-badge">Ready (Local Bank)</span>
    </div>

    <!-- HOME VIEW -->
    <div id="home-view" class="view active">
      <div class="welcome-header">
        <h1>Drop-off Trivia Dash 🚗</h1>
        <p>Choose a profile to start your morning trivia!</p>
      </div>

      <div class="profile-cards">
        <div class="profile-card" data-profile="william" onclick="startQuizFor('william')">
          <div>
            <h3>William</h3>
            <p style="font-size: 0.85rem; color: #707ebe;">2nd Grade Trivia • Math, Science & AI</p>
          </div>
          <span class="start-badge bg-william">Start →</span>
        </div>

        <div class="profile-card" data-profile="evan" onclick="startQuizFor('evan')">
          <div>
            <h3>Evan</h3>
            <p style="font-size: 0.85rem; color: #707ebe;">4th Grade Trivia • Math, Science & AI</p>
          </div>
          <span class="start-badge bg-evan">Start →</span>
        </div>
      </div>

      <div class="api-config">
        <input type="password" id="api-key-input" placeholder="Paste Gemini API Key (Optional)" />
        <button onclick="saveApiKey()" style="padding: 8px 12px; border-radius:8px; border:none; background:var(--primary); color:white; font-weight:bold; cursor:pointer;">Save</button>
      </div>
    </div>

    <!-- QUIZ VIEW -->
    <div id="quiz-view" class="view">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span id="player-tag" style="font-weight: bold; color: var(--text-dark);">Playing: William</span>
        <span id="score-counter" style="font-weight: bold; color: var(--primary);">Score: 0/5</span>
      </div>

      <div class="progress-bar-container">
        <div id="progress" class="progress-bar"></div>
      </div>

      <div id="question" class="question-text">Loading question...</div>
      <div id="options" class="options-grid"></div>
    </div>

    <!-- SUMMARY VIEW -->
    <div id="summary-view" class="view" style="text-align: center; padding: 20px 0;">
      <h2 style="font-size: 2rem; margin-bottom: 10px;">🎉 Great Job!</h2>
      <p id="summary-text" style="font-size: 1.1rem; color: #707ebe; margin-bottom: 20px;">You completed the drop-off trivia!</p>
      <button onclick="goHome()" style="padding: 14px 28px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 1rem; cursor: pointer;">
        Back to Home
      </button>
    </div>
  </div>

  <script>
    const STATIC_BANKS = {
      william: [
        { q: "What is 15 + 8?", options: ["21", "22", "23", "24"], answer: 2 },
        { q: "Which gas do plants absorb from the air?", options: ["Oxygen", "Carbon Dioxide", "Nitrogen", "Helium"], answer: 1 },
        { q: "Spell the word for a place with lots of books:", options: ["Librery", "Library", "Libary", "Lybrary"], answer: 1 },
        { q: "What simple machine is a ramp?", options: ["Lever", "Inclined Plane", "Pulley", "Screw"], answer: 1 },
        { q: "What holds a robot's instructions?", options: ["Batteries", "Code", "Wires", "Wheels"], answer: 1 }
      ],
      evan: [
        { q: "What is 12 × 7?", options: ["72", "84", "96", "82"], answer: 1 },
        { q: "Which part of the cell is known as the powerhouse?", options: ["Nucleus", "Mitochondria", "Cell Wall", "Ribosome"], answer: 1 },
        { q: "Which word is an adverb?", options: ["Quickly", "Runner", "Bright", "Blue"], answer: 0 },
        { q: "What force resists motion between two sliding surfaces?", options: ["Gravity", "Friction", "Magnetism", "Tension"], answer: 1 },
        { q: "In AI, what does 'ML' stand for?", options: ["Machine Logic", "Machine Learning", "Model Layer", "Main Loop"], answer: 1 }
      ]
    };

    let currentProfile = 'william';
    let activeQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let abortController = null;

    window.onload = () => {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) document.getElementById('api-key-input').value = savedKey;
      goHome();
    };

    function saveApiKey() {
      const key = document.getElementById('api-key-input').value.trim();
      localStorage.setItem('gemini_api_key', key);
      updateStatusBadge("API Key Saved!");
    }

    function updateStatusBadge(msg) {
      document.getElementById('badge').innerText = msg;
    }

    function switchView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }

    function goHome() {
      if (abortController) abortController.abort();
      switchView('home-view');
      updateStatusBadge("Ready (Local Bank)");
    }

    function startQuizFor(profile) {
      currentProfile = profile;

      // 1. Check local cache first (saved within 1 hour)
      const cachedData = localStorage.getItem(`cache_${profile}`);
      if (cachedData) {
        try {
          const { timestamp, questions } = JSON.parse(cachedData);
          if (Date.now() - timestamp < 3600000) { // 1 Hour
            activeQuestions = questions;
            updateStatusBadge("Loaded (Cached AI)");
          } else {
            activeQuestions = [...STATIC_BANKS[profile]];
          }
        } catch(e) { activeQuestions = [...STATIC_BANKS[profile]]; }
      } else {
        activeQuestions = [...STATIC_BANKS[profile]];
      }

      currentIndex = 0;
      score = 0;

      const profileName = profile === 'william' ? "William (2nd Gr)" : "Evan (4th Gr)";
      document.getElementById('player-tag').innerText = `Playing: ${profileName}`;

      switchView('quiz-view');
      renderQuestion();
      
      // 2. Fetch fresh questions quietly in background only if cache is old or missing
      fetchFreshQuestionsFromGemini(profile);
    }

    function renderQuestion() {
      if (currentIndex >= activeQuestions.length) {
        renderSummary();
        return;
      }

      const q = activeQuestions[currentIndex];
      document.getElementById('score-counter').innerText = `Score: ${score}/5`;
      document.getElementById('progress').style.width = `${(currentIndex / 5) * 100}%`;
      document.getElementById('question').innerText = `${currentIndex + 1}. ${q.q}`;

      const optionsContainer = document.getElementById('options');
      optionsContainer.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => handleAnswer(idx, q.answer, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function handleAnswer(selectedIdx, correctIdx, btn) {
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(b => b.style.pointerEvents = 'none');

      if (selectedIdx === correctIdx) {
        btn.classList.add('correct');
        score++;
        triggerConfetti();
      } else {
        btn.classList.add('incorrect');
        buttons[correctIdx].classList.add('correct');
      }

      setTimeout(() => {
        currentIndex++;
        renderQuestion();
      }, 1200);
    }

    function renderSummary() {
      switchView('summary-view');
      document.getElementById('summary-text').innerHTML = `You scored <strong>${score} out of 5</strong>!`;
      triggerConfetti();
    }

    async function fetchFreshQuestionsFromGemini(profile) {
      const apiKey = localStorage.getItem('gemini_api_key');
      if (!apiKey) {
        updateStatusBadge("Local Bank (No Key)");
        return;
      }

      // Check if cache is still fresh (< 1 hour) before calling API
      const cachedData = localStorage.getItem(`cache_${profile}`);
      if (cachedData) {
        try {
          const { timestamp } = JSON.parse(cachedData);
          if (Date.now() - timestamp < 3600000) {
            updateStatusBadge("AI Cache Active");
            return; // Skip API call to preserve quota
          }
        } catch(e) {}
      }

      if (abortController) abortController.abort();
      abortController = new AbortController();

      updateStatusBadge("Syncing AI...");

      const grade = profile === 'william' ? "2nd Grade" : "4th Grade";
      const prompt = `Generate 5 multiple-choice trivia questions for a ${grade} student. Subjects: Math, Science, Spelling, Engineering, and AI. Provide output ONLY as a JSON array of objects with keys: "q" (string), "options" (array of 4 strings), and "answer" (index 0-3).`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          signal: abortController.signal,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { responseMimeType: "application/json" }
          })
        });

        if (response.status === 429) {
          updateStatusBadge("Rate Limited (Local Bank)");
          return;
        }

        if (!response.ok) {
          const errDetails = await response.json().catch(() => ({}));
          throw new Error(`HTTP ${response.status}: ${errDetails.error?.message || response.statusText}`);
        }

        const data = await response.json();
        let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
        rawText = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();

        const parsedQuestions = JSON.parse(rawText);

        if (Array.isArray(parsedQuestions) && parsedQuestions.length >= 5) {
          STATIC_BANKS[profile] = parsedQuestions.slice(0, 5);
          // Save to local cache for 1 hour
          localStorage.setItem(`cache_${profile}`, JSON.stringify({
            timestamp: Date.now(),
            questions: parsedQuestions.slice(0, 5)
          }));
          updateStatusBadge("AI Questions Ready!");
        }

      } catch (err) {
        if (err.name === 'AbortError') {
          console.log("Fetch aborted cleanly.");
        } else {
          console.error("Gemini API Error:", err);
          updateStatusBadge("Local Bank Active");
        }
      }
    }

    function triggerConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = Array.from({ length: 35 }, () => ({
        x: canvas.width / 2,
        y: canvas.height / 2,
        vx: (Math.random() - 0.5) * 12,
        vy: (Math.random() - 0.5) * 12 - 4,
        size: Math.random() * 8 + 4,
        color: `hsl(${Math.random() * 360}, 100%, 50%)`,
        alpha: 1
      }));

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;

        particles.forEach(p => {
          if (p.alpha > 0) {
            active = true;
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.3;
            p.alpha -= 0.02;
            ctx.fillStyle = p.color;
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.fillRect(p.x, p.y, p.size, p.size);
          }
        });

        if (active) requestAnimationFrame(animate);
      }
      animate();
    }
  </script>
</body>
</html>

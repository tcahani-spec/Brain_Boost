<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drop-off Trivia Dash</title>
  <style>
    :root {
      --bg-color: #f4f7fe;
      --card-bg: #ffffff;
      --primary: #4318ff;
      --primary-hover: #3311cc;
      --william-color: #00b5d8;
      --evan-color: #805ad5;
      --text-dark: #2b3674;
      --text-muted: #a3edd9;
      --correct: #05cd99;
      --incorrect: #ee5d50;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
      overflow-x: hidden;
    }

    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0px 18px 40px rgba(112, 144, 176, 0.12);
      position: relative;
      z-index: 10;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .profile-selector {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-bottom: 20px;
    }

    .profile-btn {
      flex: 1;
      padding: 12px;
      border: 2px solid #e0e5f2;
      border-radius: 16px;
      background: #fff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #707ebe;
    }

    .profile-btn.active[data-profile="william"] {
      background: var(--william-color);
      border-color: var(--william-color);
      color: #fff;
    }

    .profile-btn.active[data-profile="evan"] {
      background: var(--evan-color);
      border-color: var(--evan-color);
      color: #fff;
    }

    .api-config {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .api-config input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #e0e5f2;
      border-radius: 8px;
      font-size: 0.8rem;
    }

    .progress-bar-container {
      height: 8px;
      width: 100%;
      background: #e0e5f2;
      border-radius: 4px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width 0.3s ease;
    }

    .quiz-card {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .question-text {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-dark);
      min-height: 60px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      padding: 14px 16px;
      border: 2px solid #e0e5f2;
      border-radius: 12px;
      background: #f8fafc;
      font-size: 1rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .option-btn:hover { background: #edf2f7; }
    .option-btn.correct { background: var(--correct) !important; color: white; border-color: var(--correct); }
    .option-btn.incorrect { background: var(--incorrect) !important; color: white; border-color: var(--incorrect); }

    .status-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      background: #edf2f7;
      color: #4a5568;
    }

    .summary-card {
      text-align: center;
      padding: 20px 0;
    }

    .summary-card h2 { font-size: 2rem; margin-bottom: 10px; }
    .summary-card button {
      margin-top: 20px;
      padding: 12px 24px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <div class="container">
    <div class="header">
      <span id="badge" class="status-badge">Ready (Offline Bank)</span>
      <span id="score-counter" style="font-weight: bold;">Score: 0/5</span>
    </div>

    <!-- API Key Input -->
    <div class="api-config">
      <input type="password" id="api-key-input" placeholder="Paste Gemini API Key (Optional)" />
      <button onclick="saveApiKey()" style="padding: 8px 12px; border-radius:8px; border:none; background:#2b3674; color:white; cursor:pointer;">Save</button>
    </div>

    <!-- Profile Selection -->
    <div class="profile-selector">
      <button class="profile-btn active" data-profile="william" onclick="selectProfile('william')">William (2nd Gr)</button>
      <button class="profile-btn" data-profile="evan" onclick="selectProfile('evan')">Evan (4th Gr)</button>
    </div>

    <div class="progress-bar-container">
      <div id="progress" class="progress-bar"></div>
    </div>

    <!-- Quiz Content -->
    <div id="quiz-body" class="quiz-card">
      <div id="question" class="question-text">Loading question...</div>
      <div id="options" class="options-grid"></div>
    </div>
  </div>

  <script>
    // --- 1. STATIC INSTANT FALLBACK BANKS (0ms Latency) ---
    const STATIC_BANKS = {
      william: [
        { q: "What is 15 + 8?", options: ["21", "22", "23", "24"], answer: 2 },
        { q: "Which gas do plants absorb from the air?", options: ["Oxygen", "Carbon Dioxide", "Nitrogen", "Helium"], answer: 1 },
        { q: "Spell the word for a place with lots of books:", options: ["Librery", "Library", "Libary", "Lybrary"], answer: 1 },
        { q: "What simple machine is a ramp?", options: ["Lever", "Inclined Plane", "Pulley", "Screw"], answer: 1 },
        { q: "What holds a robot's instructions?", options: ["Batteries", "Code", "Wires", "Wheels"], answer: 1 }
      ],
      evan: [
        { q: "What is 12 × 7?", options: ["72", "84", "96", "82"], answer: 1 },
        { q: "Which part of the cell is known as the powerhouse?", options: ["Nucleus", "Mitochondria", "Cell Wall", "Ribosome"], answer: 1 },
        { q: "Which word is an adverb?", options: ["Quickly", "Runner", "Bright", "Blue"], answer: 0 },
        { q: "What force resists motion between two sliding surfaces?", options: ["Gravity", "Friction", "Magnetism", "Tension"], answer: 1 },
        { q: "In AI, what does 'ML' stand for?", options: ["Machine Logic", "Machine Learning", "Model Layer", "Main Loop"], answer: 1 }
      ]
    };

    // --- STATE MANAGEMENT ---
    let currentProfile = 'william';
    let activeQuestions = [...STATIC_BANKS.william];
    let currentIndex = 0;
    let score = 0;
    let abortController = null;

    // --- INITIALIZATION ---
    window.onload = () => {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) document.getElementById('api-key-input').value = savedKey;
      loadQuizSession();
    };

    function saveApiKey() {
      const key = document.getElementById('api-key-input').value.trim();
      localStorage.setItem('gemini_api_key', key);
      updateStatusBadge("API Key Saved!");
    }

    function updateStatusBadge(msg) {
      document.getElementById('badge').innerText = msg;
    }

    // --- PROFILE SWITCHING (FAST & SAFE) ---
    function selectProfile(profile) {
      if (currentProfile === profile && currentIndex < activeQuestions.length) return;

      currentProfile = profile;
      document.querySelectorAll('.profile-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.profile === profile);
      });

      // 1. Instant local load (Fixes 3s lag)
      activeQuestions = [...STATIC_BANKS[profile]];
      currentIndex = 0;
      score = 0;
      renderQuestion();

      // 2. Safely trigger background fetch for fresh questions
      fetchFreshQuestionsFromGemini(profile);
    }

    function loadQuizSession() {
      currentIndex = 0;
      score = 0;
      renderQuestion();
    }

    // --- UI RENDER ---
    function renderQuestion() {
      if (currentIndex >= activeQuestions.length) {
        renderSummary();
        return;
      }

      const q = activeQuestions[currentIndex];
      document.getElementById('score-counter').innerText = `Score: ${score}/5`;
      document.getElementById('progress').style.width = `${(currentIndex / 5) * 100}%`;
      document.getElementById('question').innerText = `${currentIndex + 1}. ${q.q}`;

      const optionsContainer = document.getElementById('options');
      optionsContainer.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => handleAnswer(idx, q.answer, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function handleAnswer(selectedIdx, correctIdx, btn) {
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(b => b.style.pointerEvents = 'none');

      if (selectedIdx === correctIdx) {
        btn.classList.add('correct');
        score++;
        triggerConfetti();
      } else {
        btn.classList.add('incorrect');
        buttons[correctIdx].classList.add('correct');
      }

      setTimeout(() => {
        currentIndex++;
        renderQuestion();
      }, 1200);
    }

    function renderSummary() {
      document.getElementById('progress').style.width = `100%`;
      document.getElementById('score-counter').innerText = `Score: ${score}/5`;
      document.getElementById('quiz-body').innerHTML = `
        <div class="summary-card">
          <h2>🎉 Great Job!</h2>
          <p>You scored <strong>${score} out of 5</strong>!</p>
          <button onclick="restartQuiz()">Play Again</button>
        </div>
      `;
    }

    function restartQuiz() {
      location.reload();
    }

    // --- 2. GEMINI API FETCH (SAFE & NON-BLOCKING) ---
    async function fetchFreshQuestionsFromGemini(profile) {
      const apiKey = localStorage.getItem('gemini_api_key');
      if (!apiKey) {
        updateStatusBadge("Offline (No Key)");
        return;
      }

      // Abort any prior pending request to avoid race conditions (Fixes Evan crash)
      if (abortController) abortController.abort();
      abortController = new AbortController();

      updateStatusBadge("Syncing AI Questions...");

      const grade = profile === 'william' ? "2nd Grade" : "4th Grade";
      const prompt = `Generate 5 multiple-choice trivia questions for a ${grade} student. 
        Subjects: Math, Science, Spelling, Engineering, and AI. 
        Provide output as a raw JSON array of objects with keys: "q" (string), "options" (array of 4 strings), and "answer" (index 0-3 of correct answer).`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          signal: abortController.signal,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { responseMimeType: "application/json" }
          })
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        const rawText = data.candidates[0].content.parts[0].text;
        const parsedQuestions = JSON.parse(rawText);

        if (Array.isArray(parsedQuestions) && parsedQuestions.length >= 5) {
          STATIC_BANKS[profile] = parsedQuestions.slice(0, 5); // Cache fresh set
          updateStatusBadge("AI Fresh Questions Ready!");
        }
      } catch (err) {
        if (err.name === 'AbortError') {
          console.log("Fetch aborted due to profile switch.");
        } else {
          console.warn("Gemini API call failed, keeping static bank:", err);
          updateStatusBadge("Using Local Bank");
        }
      }
    }

    // --- 3. CANVAS CONFETTI EFFECT ---
    function triggerConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = Array.from({ length: 40 }, () => ({
        x: canvas.width / 2,
        y: canvas.height / 2,
        vx: (Math.random() - 0.5) * 12,
        vy: (Math.random() - 0.5) * 12 - 4,
        size: Math.random() * 8 + 4,
        color: `hsl(${Math.random() * 360}, 100%, 50%)`,
        alpha: 1
      }));

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;

        particles.forEach(p => {
          if (p.alpha > 0) {
            active = true;
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.3; // Gravity
            p.alpha -= 0.02;
            ctx.fillStyle = p.color;
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.fillRect(p.x, p.y, p.size, p.size);
          }
        });

        if (active) requestAnimationFrame(animate);
      }
      animate();
    }
  </script>
</body>
</html>
